# Publishes the web app to GitHub Pages.
#
# The workflow lives here rather than in webapp/.github/workflows/ because
# GitHub only reads workflows from the repository root .github/workflows.
#
# There is no build step: the app is plain ES modules, so "building" is copying
# webapp/ into one directory and uploading it.
#
# Since v2.0.0 the site ships NO DATA. Rows come from the API, which caps
# anonymous requests at 100; publishing the tables next to the page would make
# that cap decoration. The guard below fails the build rather than let a data
# file reach the site by accident.

name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r webapp/. _site/
          echo "--- site contents ---"
          find _site -type f | sort
          du -sh _site

      - name: Refuse to publish data
        run: |
          set -euo pipefail
          offenders=$(find _site -type f \
            \( -name '*.parquet' -o -name '*.csv' -o -name '*.csv.gz' \) || true)
          if [ -n "$offenders" ]; then
            echo "These would be published on an open URL, defeating the API cap:"
            echo "$offenders"
            exit 1
          fi
          # Anything unexpectedly large is data by another name.
          big=$(find _site -type f -size +2M || true)
          if [ -n "$big" ]; then
            echo "Unexpectedly large files in the site:"; echo "$big"; exit 1
          fi

      - name: Check the site is wired to a real API
        run: |
          set -euo pipefail
          test -s _site/index.html
          if grep -q 'REPLACE-ME' _site/src/config.js; then
            echo "webapp/src/config.js still holds the placeholder API URL."
            echo "Run: python scripts/set_api_url.py https://<worker>.workers.dev/v1"
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
