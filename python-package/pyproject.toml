[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leaders-tweets"
version = "2.0.0"
description = "Programmatic access to the Executive Social Media Database: tweets and engagement metrics for 62 heads of government and state."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Juan Gomez Cruces" }]
keywords = ["twitter", "politics", "heads of government", "social media", "dataset"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pandas>=1.5",
  "pyarrow>=12",
  "platformdirs>=3",
  "requests>=2.28",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/juangomezcruces/Executive-Social-Media-Database"
Documentation = "https://juangomezcruces.github.io/Executive-Social-Media-Database/"
Source = "https://github.com/juangomezcruces/Executive-Social-Media-Database"

[tool.hatch.build.targets.wheel]
packages = ["src/leaders_tweets"]
